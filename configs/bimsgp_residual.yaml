# BiMSGP-protocol FT-Transformer evaluation on Wheat599 (independent runner).
# Residual variant: fixed RR-BLUP baseline + FT-Transformer correction, same
# A backbone (marker-only; "A" here is the architecture label, not wheat.A).

protocol:
  name: bimsgp_ftt_residual_wheat599
  data: data/raw/wheat.RData
  data_sha256: 8710523389007dd8b7c88a5deb74ee16aea0bae158496bc11f0626fb43b5ea21
  # Optional raw-Y override (.npy or .csv, 599x4). Default: reuse the BGLR Y
  # from `data` (mean 0, sd 1).
  y_path: data/raw/wheat.RData
  environments: ["1", "2", "4", "5"]
  folds: 10
  fold_seed: 42
  # Standard 10-fold CV: every material is in the test set exactly once.
  # 599 = 9*60 + 59. Val = 54 drawn from the remaining 539/540; train = rest.
  test_sizes: [60, 60, 60, 60, 60, 60, 60, 60, 60, 59]
  val_size: 54

model:
  d_block: 64
  n_blocks: 2
  attention_n_heads: 4
  ffn_d_hidden: 128
  ffn_d_hidden_multiplier: null
  ffn_activation: ReGLU
  attention_dropout: 0.1
  ffn_dropout: 0.1
  residual_dropout: 0.0
  positional_encoding: none

residual:
  baseline: rrblup
  baseline_alpha_selection: val_rmse
  correction_target: standardized_residual
  zero_init_output: true
  checkpoint: val_pcc
  rr_only_candidate: true
  selection_tie: rr_only

training:
  optimizer: AdamW
  lr: 0.0005
  weight_decay: 0.01
  batch_size: 8
  epochs: 100
  early_stopping: false
  lr_scheduler:
    type: ReduceLROnPlateau
    monitor: val_rmse_standardized
    mode: min
    factor: 0.5
    patience: 10
  checkpoint:
    monitor: val_pcc
    tie_break: earlier_epoch
  loss: mse_on_standardized_residual
  precision:
    forward: bfloat16
    loss: float32
  seed: 42

scaling:
  x_scaler: StandardScaler   # fit on train only, per fold, per environment
  y_scaler: StandardScaler   # fit on train only, per fold, per environment
  scope: train_only
  inverse_transform_before_metrics: true

eval:
  metrics: [pcc, rmse, mae]
  primary: pcc
  per_fold_and_summary: true
  summary: "mean +/- sample SD (ddof=1) over the 10 folds"
  paired_vs_bimsgp: none   # summary-only comparison; no same-fold pairing
  failure_policy: "explicit rows; no filtering; no nanmean"

reporting:
  oof: true
  per_fold_table: true
  failures_table: true
  limits:
    - "10 folds share materials -> not independent; descriptive only, no p-values/CIs"
    - "single seed (42); no initialization variance"
