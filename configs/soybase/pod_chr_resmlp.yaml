model: soybase_classical
source: data/raw/soybase/source.json
cache: data/raw/soybase/soybase_cache.npz
marker_map: data/raw/soybase/glyma.Wm82.gnm2.div.Song_Hyten_2015.markerMap.txt.gz
seeds:
- 42
- 2026
min_call_rate: 0.9
min_maf: 0.05
trait: POD
splits: protocols/soybase/POD_splits_manifest.json
device: cuda
cpu_threads: 2
search:
  chr_resmlp:
    d_group:
    - 8
    d_fuse:
    - 64
    learning_rate:
    - 0.002
    weight_decay:
    - 0.0003
train:
  max_epochs: 200
  patience: 20
  batch_size: 4096
  eval_batch_size: 4096
  gradient_clip: 5.0
