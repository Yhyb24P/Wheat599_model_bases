model: soybase_classical
source: data/raw/soybase/source.json
cache: data/raw/soybase/soybase_cache.npz
seeds:
- 42
- 2026
min_call_rate: 0.9
min_maf: 0.05
trait: ST
splits: protocols/soybase/ST_splits_manifest.json
device: cuda
cpu_threads: 2
search:
  tabm:
    n_blocks:
    - 3
    d_block:
    - 256
    dropout:
    - 0.1
    k:
    - 32
    learning_rate:
    - 0.0005
    - 0.002
    weight_decay:
    - 0.0003
    - 0.01
train:
  max_epochs: 200
  patience: 20
  batch_size: 256
  eval_batch_size: 2048
  gradient_clip: 5.0
