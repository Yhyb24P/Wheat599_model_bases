adaptation_notes:
  - Official compiled trainer (dnngp.cpython-39 .so) called directly with Wheat2000 protocol splits; official internal KFold path bypassed. Same protocol adaptation as the frozen Wheat599 DNNGP run, not a reproduction of the paper's wheat dataset numbers.
  - Input PCA at 95% variance refitted on each inner/dev training subset of the 33709-marker Wheat2000 panel; raw markers not used directly.
  - Targets are the released Wheat2000 pheno columns (TKW/TW/GL/GW/GH/GP/SDS/PHT) used as-is; the driver standardizes nothing for DNNGP, matching the Wheat599 adaptation.
  - The compiled prepare() hardcodes tf.random.set_seed(123); protocol seeds are applied immediately before each fit and to numpy shuffle order.
  - Inner best epoch is argmin of per-epoch val_loss; refit replays the frozen per-epoch median lr for the median epoch count on merged dev rows.
