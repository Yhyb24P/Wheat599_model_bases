ssh_alias: dell
proxy_jump: omen
host: 10.88.103.184
user: dell
allowed_root: /home/dell/mnt/data/projects/intern/active/pangjy
repository: /home/dell/mnt/data/projects/intern/active/pangjy/Wheat599-research
